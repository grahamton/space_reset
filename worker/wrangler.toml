name = "space-reset-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves both the app and the API, so they share an origin: no
# CORS, no VITE_WORKER_URL, and a single Cloudflare Access application
# protects everything. `npm run deploy` at the repo root builds ../dist first.
[assets]
directory = "../dist"
# Client-side routing: unknown paths get index.html instead of a 404.
not_found_handling = "single-page-application"
# Only the API runs Worker code; everything else is a static file.
run_worker_first = ["/api/*"]

# The app is public and every analysis is billed to one Anthropic key: at most
# 3 per IP per minute. Cloudflare only allows a 10 or 60 second period.
[[ratelimits]]
name = "MISSIONS_RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3
  period = 60

# The approximate edge limit above is a fast guard. This SQLite-backed
# Durable Object makes the per-IP 60-second window and daily global cap exact.
[[durable_objects.bindings]]
name = "MISSION_QUOTA"
class_name = "MissionQuota"

[exports.MissionQuota]
type = "durable-object"
storage = "sqlite"

# The app calls the API from its own origin; Rainbowfetch's static page also
# calls it cross-origin. localhost is always allowed for local development.
[vars]
ALLOWED_ORIGIN = "https://rainbowfetch.com,https://www.rainbowfetch.com"
DAILY_MISSION_CAP = "50"

# ANTHROPIC_API_KEY is a secret, never a var:
#   local dev  -> worker/.dev.vars   (gitignored)
#   production -> wrangler secret put ANTHROPIC_API_KEY
